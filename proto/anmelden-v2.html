<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Anmelden – Serdar Tennis (Prototyp v2)</title>
<link rel="stylesheet" href="../fonts/poppins.css">
<style>
  :root{--dark:#3D3A36;--olive:#5E6D55;--olive2:#4F5D47;--cream:#F3E8D8;--cream2:#E9DCC4;--sand:#D9CDB8;--tan:#B39B72;--grey:#7A746C;--mute:#A39C92;--err:#A9714B}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--cream);color:var(--dark);font-family:'Avenir Next','Avenir','Segoe UI',Montserrat,Helvetica,Arial,sans-serif;font-weight:300;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
  body{min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
  button{font:inherit;color:inherit}
  .proto{position:sticky;top:0;z-index:20;background:var(--dark);color:var(--cream);font-size:12px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:4px 8px;min-height:34px;padding:6px 12px;letter-spacing:.2px;text-align:center;line-height:1.3}
  .proto b{font-family:Poppins,sans-serif;font-weight:500;background:var(--tan);color:#fff;border-radius:20px;padding:2px 9px;font-size:10.5px;letter-spacing:1px;text-transform:uppercase}
  .wrap{max-width:720px;margin:0 auto;padding:22px 16px 40px}
  header{margin-bottom:18px}
  .eyebrow{font-family:Poppins,sans-serif;font-weight:600;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--tan)}
  h1{font-family:Poppins,sans-serif;font-weight:600;font-size:30px;line-height:1.15;margin-top:4px}
  h1:after,h2.u:after{content:"";display:block;width:40px;height:2px;background:var(--olive);margin-top:10px}
  .sub{margin-top:10px;font-size:15px;color:var(--grey);line-height:1.5}
  .steps{display:flex;gap:6px;margin:18px 0 22px}
  .steps div{flex:1;min-width:0}
  .steps i{display:block;height:3px;border-radius:3px;background:var(--sand);transition:background .25s}
  .steps span{display:block;margin-top:6px;font-size:11.5px;color:var(--grey);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .steps .on i{background:var(--olive)} .steps .cur span{color:var(--dark);font-family:Poppins,sans-serif;font-weight:500}
  h2{font-family:Poppins,sans-serif;font-weight:600;font-size:21px;line-height:1.25}
  .hint{font-size:14px;color:var(--grey);margin-top:6px;line-height:1.5}
  .back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--grey);font-size:14px;cursor:pointer;padding:8px 0;margin-bottom:6px}
  .back:hover{color:var(--dark)}
  .view{animation:fi .25s ease}
  @keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .card{background:#fff;border:1px solid var(--sand);border-radius:14px;box-shadow:0 4px 18px rgba(61,58,54,.06)}
  .clubs{display:grid;gap:12px;margin-top:16px}
  .club{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:18px;cursor:pointer;transition:all .2s}
  .club:hover{border-color:var(--olive);transform:translateY(-1px)}
  .mono{flex:0 0 52px;height:52px;border-radius:50%;background:var(--cream);border:1px solid var(--sand);display:flex;align-items:center;justify-content:center;font-family:Poppins,sans-serif;font-weight:600;font-size:15px;color:var(--olive)}
  .club .t{display:block;font-family:Poppins,sans-serif;font-weight:600;font-size:17px}
  .club .d{display:block;font-size:13.5px;color:var(--grey);margin-top:3px;line-height:1.45}
  .club .free{display:block;font-size:13px;color:var(--olive);margin-top:6px;font-weight:500}
  .chev{margin-left:auto;flex:0 0 auto;color:var(--tan);font-size:22px;line-height:1}
  .facts{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
  .facts span{font-size:12.5px;background:var(--cream2);border-radius:20px;padding:6px 11px}
  /* Tage */
  .days{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:8px;margin-top:16px}
  .dayb{background:#fff;border:1px solid var(--sand);border-radius:12px;padding:9px 4px;cursor:pointer;text-align:center;transition:all .2s;min-width:0}
  .dayb .n{display:block;font-family:Poppins,sans-serif;font-weight:600;font-size:15px}
  .dayb .c{display:block;font-size:11.5px;color:var(--grey);margin-top:2px;white-space:nowrap}
  .dayb.on{background:var(--olive);border-color:var(--olive);color:#fff}.dayb.on .c{color:rgba(255,255,255,.85)}
  .legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:14px;font-size:12.5px;color:var(--grey)}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .part{margin-top:18px}
  .part h3{font-family:Poppins,sans-serif;font-weight:600;font-size:12.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--tan);margin-bottom:8px;display:flex;align-items:baseline;gap:8px}
  .part h3 small{font-family:inherit;font-weight:400;letter-spacing:0;text-transform:none;color:var(--mute);font-size:12px}
  .slots{display:grid;gap:8px}
  .slot{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;cursor:pointer;transition:all .2s;min-height:60px}
  .slot:hover:not(:disabled){border-color:var(--olive);transform:translateY(-1px)}
  .tm{display:block;font-family:Poppins,sans-serif;font-weight:600;font-size:16px;white-space:nowrap}
  .st{display:block;font-size:13.5px;color:var(--grey);margin-top:2px}
  .st.good{color:var(--olive);font-weight:500}
  .r{margin-left:auto;display:flex;align-items:center;gap:10px;flex:0 0 auto}
  .dots{display:inline-flex;gap:5px}
  .dot{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--olive);background:transparent}
  .dot.x{background:var(--olive)}
  .dot.res{border-style:dashed;border-color:var(--tan)}
  .slot:disabled{cursor:not-allowed;background:#EFE7DA;box-shadow:none;border-color:var(--cream2)}
  .slot:disabled .tm,.slot:disabled .st{color:var(--mute)}
  .slot:disabled .dot{border-color:#BDB4A6}.slot:disabled .dot.x{background:#BDB4A6}
  .tag{font-size:10.5px;font-family:Poppins,sans-serif;font-weight:500;letter-spacing:.6px;text-transform:uppercase;border-radius:20px;padding:4px 9px;white-space:nowrap;display:inline-block}
  .tag.full{background:var(--sand);color:var(--grey)}
  .tag.ex{background:var(--dark);color:var(--cream)}
  .tag.new{background:var(--olive);color:#fff}
  .tag.ph{background:transparent;border:1px dashed var(--tan);color:var(--tan)}
  .chosen{display:flex;align-items:center;gap:12px;padding:14px 16px;margin-top:14px}
  .modes{display:grid;gap:12px;margin-top:16px}
  .mode{width:100%;text-align:left;padding:16px;cursor:pointer;transition:all .2s}
  .mode .h{display:flex;align-items:center;gap:10px}
  .radio{flex:0 0 20px;height:20px;border-radius:50%;border:1.5px solid var(--sand);display:flex;align-items:center;justify-content:center}
  .mode.on{border-color:var(--olive);box-shadow:0 0 0 2px rgba(94,109,85,.18)}
  .mode.on .radio{border-color:var(--olive)} .mode.on .radio:after{content:"";width:10px;height:10px;border-radius:50%;background:var(--olive)}
  .mode .t{font-family:Poppins,sans-serif;font-weight:600;font-size:16px}
  .mode .d{display:block;font-size:13.5px;color:var(--grey);margin:6px 0 0 30px;line-height:1.45}
  .mode.dis{cursor:not-allowed;background:#EFE7DA;box-shadow:none;border-color:var(--cream2)}
  .mode.dis .t,.mode.dis .d{color:var(--mute)}
  .inner{margin:14px 0 0 30px}
  .inner .lbl{margin-bottom:8px}
  .stepper{display:flex;align-items:center;gap:12px}
  .stepper button{width:40px;height:40px;border-radius:50%;border:1px solid var(--sand);background:var(--cream);font-size:20px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .stepper button:disabled{opacity:.35;cursor:default}
  .stepper .n{min-width:92px;text-align:center;font-family:Poppins,sans-serif;font-weight:600;font-size:15px}
  .q{margin-top:18px}
  .lbl{font-size:14px;font-weight:400;color:var(--grey);margin-bottom:8px}
  .seg{display:flex;gap:8px}
  .seg button{flex:1;min-width:0;font-size:15px;font-weight:400;color:var(--dark);background:#fff;border:1px solid var(--sand);border-radius:8px;height:44px;cursor:pointer;transition:all .2s;white-space:nowrap;padding:0 4px}
  .seg button:hover{border-color:var(--olive)}
  .seg button.on{background:var(--olive);border-color:var(--olive);color:#fff;font-family:Poppins,sans-serif;font-weight:600;font-size:14px}
  .inner .seg{gap:6px}.inner .seg button{font-size:14px;height:42px}.inner .seg button.on{font-size:13.5px}
  .price{background:var(--olive);color:#fff;border-radius:14px;padding:18px;margin-top:18px}
  .price .rl{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;opacity:.8;font-family:Poppins,sans-serif;font-weight:600}
  .price .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-top:8px;font-size:14px}
  .price .row span:first-child{opacity:.85}
  .price .row b{font-family:Poppins,sans-serif;font-weight:600;font-size:15px;white-space:nowrap;text-align:right}
  .price .line{height:1px;background:rgba(255,255,255,.25);margin:12px 0}
  .price .tot{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
  .price .tot small{display:block;opacity:.8;font-size:12.5px;margin-top:2px}
  .price .tot b{font-family:Poppins,sans-serif;font-weight:600;font-size:26px;white-space:nowrap}
  .price .note{margin-top:12px;background:rgba(255,255,255,.14);border-radius:10px;padding:8px 11px;font-size:12.5px;line-height:1.45}
  .price .ph{display:inline-block;margin-top:6px;font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;border:1px dashed rgba(255,255,255,.6);border-radius:20px;padding:3px 9px;font-family:Poppins,sans-serif;font-weight:500}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;font-family:Poppins,sans-serif;font-weight:600;font-size:15px;letter-spacing:.4px;color:#fff;background:var(--olive);border:0;border-radius:8px;height:50px;cursor:pointer;transition:all .2s;margin-top:18px;text-decoration:none}
  .btn:hover{background:var(--olive2);transform:translateY(-1px)}
  .btn.light{background:#fff;color:var(--dark);border:1px solid var(--sand)}
  .form{padding:18px;margin-top:16px}
  .req{font-size:12.5px;color:var(--mute);margin-bottom:10px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .f{margin-top:14px}.grid2 .f{margin-top:0}
  .f label{display:block;font-size:13.5px;color:var(--grey);margin-bottom:6px;font-weight:400}
  .f input{font:inherit;font-size:16px;font-weight:400;color:var(--dark);background:#fff;border:1px solid var(--sand);border-radius:8px;height:46px;padding:0 12px;width:100%;min-width:0;outline:none;transition:border .2s,box-shadow .2s}
  .f input:focus{border-color:var(--olive);box-shadow:0 0 0 3px rgba(94,109,85,.18)}
  .f input.bad{border-color:var(--err);box-shadow:0 0 0 3px rgba(169,113,75,.15)}
  .opt{font-size:12px;color:var(--mute)}
  .chk{display:flex;gap:10px;align-items:flex-start;margin-top:16px;font-size:14px;line-height:1.45;cursor:pointer}
  .chk input{flex:0 0 20px;width:20px;height:20px;margin-top:1px;accent-color:var(--olive)}
  .chk a{color:var(--olive)}
  .chk.bad span{color:var(--err)}
  .err{margin-top:12px;color:var(--err);font-size:14px}
  .err:empty{display:none}
  .done{text-align:center;padding:26px 18px}
  .ok{width:64px;height:64px;border-radius:50%;background:var(--olive);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
  .sum{margin-top:16px;text-align:left;border-top:1px solid var(--cream2)}
  .sum div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--cream2);font-size:14px}
  .sum div span:first-child{color:var(--grey);flex:0 0 auto} .sum div span:last-child{text-align:right;font-weight:500}
  /* Einladung */
  .share{padding:18px;margin-top:16px;text-align:left}
  .share .code{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;background:var(--cream);border-radius:10px;padding:10px 12px}
  .share .code span{font-size:13px;color:var(--grey)}
  .share .code b{font-family:Poppins,sans-serif;font-weight:600;font-size:18px;letter-spacing:2px}
  .linkbox{margin-top:10px;font-size:13px;color:var(--grey);background:#fff;border:1px solid var(--sand);border-radius:8px;padding:10px 12px;overflow-wrap:anywhere;line-height:1.4}
  .btn.wa{background:#3E7D57}.btn.wa:hover{background:#346a4a}
  .btns2{display:grid;grid-template-columns:1fr;gap:0}
  .tiny{font-size:12.5px;color:var(--mute);margin-top:10px;line-height:1.45}
  .notice{margin-top:16px;border:1px dashed var(--tan);border-radius:12px;padding:12px 14px;font-size:13.5px;line-height:1.5;text-align:left;background:#FBF6EE}
  .notice b{font-weight:500}
  .prog{margin-top:14px;padding:14px 16px}
  .prog .top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .prog .top b{font-family:Poppins,sans-serif;font-weight:600;font-size:15px}
  .bar{height:6px;border-radius:6px;background:var(--cream2);margin-top:10px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--olive);border-radius:6px}
  .names{margin-top:10px;font-size:13px;color:var(--grey);line-height:1.5}
  .lock{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--grey);margin-top:6px}
  footer{margin-top:30px;text-align:center;font-size:12.5px;color:var(--grey)}
  footer a{color:var(--grey)}
  /* Admin */
  .adm .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
  .adm .kpi{padding:12px}.adm .kpi b{display:block;font-family:Poppins,sans-serif;font-weight:600;font-size:20px}.adm .kpi span{font-size:12px;color:var(--grey)}
  .adm .slotbox{padding:14px 14px 6px;margin-top:10px}
  .adm .sh{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap}
  .adm .sh .tm{font-size:15px}
  .adm .inv{margin-top:8px;font-size:13px;color:var(--grey);background:var(--cream);border-radius:8px;padding:8px 10px;line-height:1.5}
  .adm .inv b{font-weight:500;color:var(--dark)}
  .adm .bk{padding:10px 0;border-top:1px solid var(--cream2);font-size:13.5px;line-height:1.45;margin-top:8px}
  .adm .bk+.bk{margin-top:0}
  .adm .bk1{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}.adm .bk1 b{font-weight:500}
  .adm .pub{color:var(--mute);font-size:12.5px}.adm .bk2{color:var(--grey);overflow-wrap:anywhere}
  .adm .pend{color:var(--tan);font-style:italic}
  .adm .emptyl{font-size:13px;color:var(--grey);line-height:1.6;margin-top:10px}
  @media (min-width:700px){
    .wrap{padding:36px 24px 50px}
    h1{font-size:36px}
    .clubs{grid-template-columns:1fr 1fr}
    .club{flex-direction:column;align-items:flex-start;padding:22px}
    .club .chev{display:none}
    .slots{grid-template-columns:1fr 1fr}
    .btns2{grid-template-columns:1fr 1fr;gap:12px}
  }
  @media (max-width:360px){h1{font-size:26px}.grid2{grid-template-columns:1fr}.grid2 .f+.f{margin-top:14px}.steps span{font-size:10.5px}.inner{margin-left:0}}
</style>
</head>
<body>
<div class="proto"><b>Prototyp v2</b><span>Beispieldaten – keine echte Buchung</span></div>
<div class="wrap" id="app"></div>
<script>
(function(){
  'use strict';
  /* ===== Preise 1:1 aus preisrechner-heerdt.html / preisrechner-wetten.html (season20), Cent pro Person und Training ===== */
  const MEMBER = {1:5000, 2:2500, 3:1667, 4:1250};   // Mitglied Heerdter TV (ohne Platzgebühr)
  const GUEST  = {1:6000, 2:3000, 3:2000, 4:1500};   // Gäste HTV + alle in Wetten (inkl. 10 € Platzgebühr, geteilt)
  const WEEKS = 20, MAX = 4, DEADLINE_DAYS = 7;
  const CLUBS = { htv:{name:'Heerdter TV', short:'HTV', days:[3,4,5,6]}, wet:{name:'SV Union Wetten', short:'SVW', days:[1,2]} };
  const DAYS = {1:'Montag',2:'Dienstag',3:'Mittwoch',4:'Donnerstag',5:'Freitag',6:'Samstag'};
  const DS = {1:'Mo',2:'Di',3:'Mi',4:'Do',5:'Fr',6:'Sa'};
  /* ===== Termine nach Serdars Regeln (60 Min. pro Training) ===== */
  const pad = n => (n<10?'0':'')+n;
  const SLOTS = [];
  function addSlots(club, d, hours){ hours.forEach(h => SLOTS.push({id:`${club}-${d}-${h}`, club, d, h, t:`${pad(h)}:00–${pad(h+1)}:00`, part: h<12?'Vormittag':'Nachmittag'})); }
  const PM = [14,15,16,17,18,19,20];
  [1,2].forEach(d => addSlots('wet', d, PM));
  [3,4,5,6].forEach(d => addSlots('htv', d, [10,11].concat(PM)));
  const slotById = id => SLOTS.find(s => s.id===id);

  /* ===== Demo-Daten (Player A–L) ===== */
  function seed(){
    const now = Date.now(), day = 864e5; let n = 0;
    const b = (slot, mode, persons, L, member, extra) => { n++; const s = slotById(slot);
      return Object.assign({id:'seed'+n, slot, club:s.club, mode, persons, vorname:'Player', nachname:L, email:`player.${L.toLowerCase()}@example.com`, tel:'0151 000000'+pad(n), level: n%2?'Anfänger':'Fortgeschritten', member, seed:true, ts: now - (10-n)*day}, extra||{}); };
    return [
      b('htv-3-10','group',1,'A',true),
      b('htv-3-17','group',2,'B',true), b('htv-3-17','group',2,'C',false),
      b('htv-3-18','excl',1,'D',true,{groupSize:4, code:'ST-DEMO', ts: now-3*day}), b('htv-3-18','invite',1,'E',false,{groupSize:4, code:'ST-DEMO', ts: now-2*day}),
      b('htv-4-15','group',2,'F',true),
      b('htv-5-19','group',4,'G',false),
      b('htv-6-10','excl',1,'H',true,{groupSize:2, code:'ST-SA10', ts: now-6*day}), b('htv-6-10','invite',1,'I',true,{groupSize:2, code:'ST-SA10', ts: now-5*day}),
      b('wet-1-16','group',2,'J',false),
      b('wet-1-18','group',3,'K',false), b('wet-1-18','group',1,'L',false)
    ];
  }
  const KEY = 'serdartennis_proto_anmelden_v2';
  function save(a){ try{ localStorage.setItem(KEY, JSON.stringify(a)); }catch(e){} }
  function load(){ try{ const x = JSON.parse(localStorage.getItem(KEY)); if(Array.isArray(x)) return x; }catch(e){} const s = seed(); save(s); return s; }
  let BOOK = load();
  function resetDemo(){ try{ localStorage.removeItem(KEY); }catch(e){} BOOK = load(); }

  /* ===== Belegung ===== */
  function occ(id){
    const list = BOOK.filter(b => b.slot===id), lead = list.find(b => b.mode==='excl');
    if(lead){ const reg = list.filter(b => b.code===lead.code).length; return {excl:true, size:lead.groupSize, reg, pending:Math.max(0, lead.groupSize-reg), taken:reg, free:0, lead}; }
    const taken = list.reduce((a,b) => a+b.persons, 0);
    return {excl:false, taken, free:Math.max(0, MAX-taken), reg:taken, pending:0};
  }
  const groupByCode = code => { const lead = BOOK.find(b => b.mode==='excl' && b.code===code); if(!lead) return null; return {lead, slot:slotById(lead.slot), members:BOOK.filter(b => b.code===code), o:occ(lead.slot)}; };
  const T = (club, member) => (club==='htv' && member) ? MEMBER : GUEST;
  function eur(c){ c = Math.round(c); const e = Math.floor(c/100), r = c%100; return String(e).replace(/\B(?=(\d{3})+(?!\d))/g,'.') + ',' + (r<10?'0':'') + r + ' €'; }
  const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const shortName = b => b.vorname + (b.nachname ? ' '+b.nachname.charAt(0).toUpperCase()+'.' : '');
  const feeNote = (club, member) => (club==='htv' && member) ? 'Mitglieder zahlen keine Platzgebühr.' : 'inkl. 10 € Platzgebühr, geteilt durch die Gruppe.';
  const plural = (n, one, many) => n + ' ' + (n===1 ? one : many);
  function dots(filled, reserved, total){ let h = '<span class="dots" aria-hidden="true">'; for(let i=0;i<(total||MAX);i++) h += `<i class="dot${i<filled?' x':(i<filled+(reserved||0)?' res':'')}"></i>`; return h+'</span>'; }
  function genCode(){ const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let c; do{ c='ST-'; for(let i=0;i<4;i++) c += A[Math.floor(Math.random()*A.length)]; }while(BOOK.some(b => b.code===c)); return c; }
  const baseUrl = () => location.href.split('#')[0].split('?')[0];
  const inviteUrl = code => baseUrl() + '?invite=' + encodeURIComponent(code);

  /* ===== Preis ===== */
  function quote(st){
    const tab = T(st.club, st.member);
    if(st.mode==='excl'){ const pp = tab[st.size]; return {pp, groupTotal: tab[1], perTraining: pp, total: pp*WEEKS}; }
    const o = occ(st.slot), g = Math.min(MAX, o.taken + st.persons), pp = tab[g];
    return {pp, groupSize:g, perTraining: pp*st.persons, total: pp*st.persons*WEEKS, ppFull: tab[MAX]};
  }

  /* ===== Zustand ===== */
  const S = {step:1, club:null, day:null, slot:null, mode:'group', persons:1, size:2, member:true, level:'', f:{vorname:'',nachname:'',email:'',tel:''}, ds:false, last:null, err:''};

  const ADMIN = /[?&]admin=1/.test(location.search);
  const IV = {code: INVITE ? decodeURIComponent(INVITE).toUpperCase() : null, done:null, member:true, level:'', f:{vorname:'',nachname:'',email:'',tel:''}, ds:false};

  function go(step, push){ S.step = step; if(push!==false){ try{ history.pushState({step}, '', '#schritt-'+step); }catch(e){} } render(); window.scrollTo(0,0); }
  window.addEventListener('popstate', e => {
    if(INVITE || ADMIN) return;
    let st = (e.state && e.state.step) || 1;

    if(st===5) st = 2;

  });

  /* ===== Bausteine ===== */
  function header(eyebrow, title, sub){ return `<header><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p class="sub">${sub}</p></header>`; }
  const SUB = '26. April – 7. Oktober 2027 · 20 Wochen<br>Ein fester Termin pro Woche';
  function stepper(){
    const labels = ['Verein','Termin','Buchung','Daten'];
    return '<nav class="steps" aria-label="Fortschritt">' + labels.map((l,i) => { const n=i+1; return `<div class="${n<=S.step?'on ':''}${n===S.step?'cur':''}"${n===S.step?' aria-current="step"':''}><i></i><span>${n}. ${l}</span></div>`; }).join('') + '</nav>';
  }
  const footer = (extra) => `<footer>${extra||''}<a href="#" data-act="reset">Demo zurücksetzen</a></footer>`;
  const backBtn = (to, txt) => `<button class="back" data-back="${to}">← ${txt}</button>`;
  function slotLine(s, o){ return `<span><span class="tm">${DAYS[s.d]} ${s.t}</span><span class="st">${CLUBS[s.club].name} · jede Woche · 60 Min.</span></span>`; }

  /* ---- Schritt 1 ---- */
  function vClub(){
    let h = `<section class="view"><h2>Wo möchtest du spielen?</h2><p class="hint">Wähle deinen Verein. Danach siehst du alle freien Trainingszeiten.</p><div class="clubs">`;

      const days = CLUBS[c].days.map(d => DS[d]).join(', ');

      h += `<button class="card club" data-club="${c}"><span class="mono">${CLUBS[c].short}</span><span><span class="t">${CLUBS[c].name}</span><span class="d">${days} · ${price}</span><span class="free">${free} freie Plätze</span></span><span class="chev">›</span></button>`;
    });

  }
  /* ---- Schritt 2 ---- */
  function vSlots(){
    const days = CLUBS[S.club].days;
    if(days.indexOf(S.day)<0) S.day = days[0];
    let h = `<section class="view">${backBtn(1,'Verein ändern')}<h2>${CLUBS[S.club].name}</h2><p class="hint">Wähle deinen festen Termin. Er gilt jede Woche für die ganze Saison, jedes Training dauert 60 Minuten.</p>`;
    h += `<div class="days" style="--n:${days.length}" role="tablist">` + days.map(d => { const free = SLOTS.filter(s => s.club===S.club && s.d===d).reduce((a,s) => a+occ(s.id).free, 0);
      return `<button class="dayb${d===S.day?' on':''}" role="tab" aria-selected="${d===S.day}" data-day="${d}"><span class="n">${days.length>2?DS[d]:DAYS[d]}</span><span class="c">${free} frei</span></button>`; }).join('') + '</div>';
    h += `<div class="legend"><span>${dots(1,0,1)} belegt</span><span><span class="dots"><i class="dot"></i></span> frei</span><span><span class="tag ex">Exklusiv</span> nur mit Einladung</span></div>`;

    Object.keys(parts).forEach(p => {
      const ss = parts[p];

      ss.forEach(s => {
        const o = occ(s.id), dis = o.free===0, mine = BOOK.some(b => b.slot===s.id && !b.seed);

  /* ---- Schritt 3 ---- */

  function vMode(){

      `<span class="d">${o.taken===0?'Du startest die Gruppe, weitere Spieler können dazukommen.':'Du trainierst mit anderen Spielern.'} Noch ${plural(o.free,'Platz','Plätze')} frei.</span>`+
      (S.mode==='group' ? `<div class="inner"><div class="lbl">Wie viele Personen meldest du an?</div><div class="stepper"><button type="button" data-p="-1"${S.persons<=1?' disabled':''} aria-label="weniger">−</button><span class="n">${plural(S.persons,'Person','Personen')}</span><button type="button" data-p="1"${S.persons>=o.free?' disabled':''} aria-label="mehr">+</button></div></div>` : '') + '</div>';
    h += `<div role="radio" tabindex="${canEx?0:-1}" aria-checked="${S.mode==='excl'}" class="card mode${S.mode==='excl'?' on':''}${canEx?'':' dis'}" data-mode="excl"${canEx?'':' aria-disabled="true"'}><span class="h"><span class="radio"></span><span class="t">Gruppe exklusiv buchen</span></span>`+

      (S.mode==='excl' ? `<div class="inner"><div class="lbl">Wir sind zu …</div><div class="seg" data-k="size">${[1,2,3,4].map(n => `<button data-v="${n}" class="${S.size===n?'on':''}">${n===1?'Allein':'zu '+n}</button>`).join('')}</div></div>` : '') + '</div></div>';

    return h + priceBox() + `<button class="btn" data-act="toDetails">Weiter zu deinen Daten</button></section>`;

  /* ---- Formular (auch für Einladung) ---- */
  function formCard(st){
    const inp = (id,label,type,ac,extra) => `<div class="f"><label for="${id}">${label}</label><input id="${id}" name="${id}" type="${type}" autocomplete="${ac}" ${extra||''} value="${esc(st.f[id])}"></div>`;
    return `<div class="card form"><div class="req">Alle Felder ausfüllen, außer „optional“.</div><div class="grid2">${inp('vorname','Vorname','text','given-name','autocapitalize="words"')}${inp('nachname','Nachname','text','family-name','autocapitalize="words"')}</div>`+

      `<div class="q"><div class="lbl">Spielniveau <span class="opt">(optional)</span></div><div class="seg" data-k="level"><button data-v="Anfänger" class="${st.level==='Anfänger'?'on':''}">Anfänger</button><button data-v="Fortgeschritten" class="${st.level==='Fortgeschritten'?'on':''}">Fortgeschritten</button></div></div>`+

      `<button class="btn light" data-act="copy" data-url="${esc(url)}">Link kopieren</button></div>`+

    h += `<h2 style="margin-top:22px">Deine Daten</h2><p class="hint">Du meldest nur dich selbst an.</p>` + formCard(IV);
    h += `<div class="price"><div class="rl">Dein Anteil</div><div class="row"><span>Gruppenpreis pro Training</span><b>${eur(tab[1])}</b></div><div class="row"><span>Dein Anteil (÷ ${g.lead.groupSize})</span><b>${eur(pp)}</b></div>`+
      `<div class="line"></div><div class="tot"><span>Saison gesamt<small>dein Anteil · 20 Wochen</small></span><b>${eur(pp*WEEKS)}</b></div><div class="note">${feeNote(s.club, s.club==='htv'&&IV.member)}</div></div>`;
    return h + `<div class="err" id="err" role="alert">${esc(IV.err||'')}</div><button class="btn" data-act="ivsubmit">Jetzt anmelden</button><p class="hint" style="text-align:center;margin-top:10px">Die Rechnung kommt per E-Mail. Du bezahlst vor dem ersten Training.</p></section>` + footer();
  }
  /* ---- Admin (?admin=1) ---- */
  function vAdmin(){
    document.title = 'Buchungen – Admin (Prototyp v2)';
    let h = header('Admin · nur für Serdar', 'Buchungen', 'Sommersaison 2027 · Beispieldaten aus diesem Browser') + '<div class="adm">';
    ['htv','wet'].forEach(c => {
      const slots = SLOTS.filter(s => s.club===c);
      let reg=0, res=0, cnt=0; const empty = [];
      slots.forEach(s => { const o = occ(s.id); reg += o.reg; res += o.pending; });
      cnt = BOOK.filter(b => b.club===c).length;
      h += `<h2 class="u" style="margin-top:26px">${CLUBS[c].name}</h2><div class="kpis"><div class="card kpi"><b>${cnt}</b><span>Anmeldungen</span></div><div class="card kpi"><b>${reg}/${slots.length*MAX}</b><span>Plätze belegt</span></div><div class="card kpi"><b>${res}</b><span>reserviert</span></div></div>`;
      slots.forEach(s => {
        const o = occ(s.id), list = BOOK.filter(b => b.slot===s.id);
        if(!list.length){ empty.push(`${DS[s.d]} ${s.t.slice(0,5)}`); return; }
        h += `<div class="card slotbox"><div class="sh"><span class="tm">${DS[s.d]} ${s.t}</span>${o.excl?`<span class="tag ex">Exklusiv</span>${dots(o.reg,o.pending,o.size)}`:dots(o.taken)}<span class="st" style="margin:0">${o.excl?`${o.reg} von ${o.size} angemeldet`:o.free===0?'voll':o.free+' frei'}</span></div>`;
        if(o.excl){
          const age = Math.floor((Date.now()-o.lead.ts)/864e5), left = DEADLINE_DAYS-age;
          h += `<div class="inv">Code <b>${esc(o.lead.code)}</b> · Einladung: <b>${o.pending?'offen':'vollständig'}</b>${o.pending?` · ${plural(o.pending,'Platz','Plätze')} reserviert · ${left>0?'Frist: noch '+plural(left,'Tag','Tage'):'<span style="color:var(--err)">Frist abgelaufen – Gruppe kontaktieren</span>'}`:''}<br><a href="${esc(inviteUrl(o.lead.code))}" style="color:var(--olive)">Einladungslink öffnen</a></div>`;
        }
        list.forEach(b => {
          const tab = T(c, b.member), pp = b.mode==='group' ? tab[Math.min(MAX, Math.max(1, o.taken))] : tab[b.groupSize];
          const role = b.mode==='excl' ? 'Exklusiv · bucht für '+b.groupSize : b.mode==='invite' ? 'eingeladen' : 'Gruppe';
          h += `<div class="bk"><div class="bk1"><b>${esc(b.vorname+' '+b.nachname)}</b>${b.seed?'':'<span class="tag new">neu</span>'}<span class="pub">öffentlich: ${esc(shortName(b))}</span></div>`+
            `<div class="bk2">${plural(b.persons,'Person','Personen')} · ${role}${c==='htv'?' · '+(b.member?'Mitglied':'Gast'):''}${b.level?' · '+esc(b.level):''}</div><div class="bk2">${esc(b.email)} · ${esc(b.tel)}</div><div class="bk2">${eur(pp)} p. P. / Training*</div></div>`;
        });
        for(let i=0;i<o.pending;i++) h += `<div class="bk pend">Reservierter Platz – wartet auf Anmeldung über den Link</div>`;
        h += '</div>';
      });
      if(empty.length) h += `<p class="emptyl"><b style="font-weight:500">Noch ohne Anmeldung (${empty.length}):</b> ${empty.join(' · ')}</p>`;
    });
    h += `<p class="hint" style="margin-top:16px">* Gruppe: Preis bei aktueller Gruppengröße. Exklusiv: Gruppenpreis geteilt durch die gebuchte Gruppengröße. Logik aus dem Preisrechner.</p></div>`;
    return h + footer(`<a href="${baseUrl()}">Zur Anmeldeseite</a> · `);
  }

  function render(){
    if(ADMIN){ app.innerHTML = vAdmin(); return; }
    if(INVITE){ app.innerHTML = vInvite(); return; }
    const v = S.step===1?vClub():S.step===2?vSlots():S.step===3?vMode():S.step===4?vDetails():vDone();
    app.innerHTML = header('Sommersaison 2027','Anmelden',SUB) + (S.step<5?stepper():'') + v + footer();
  }
  function grab(st){ ['vorname','nachname','email','tel'].forEach(k => { const el = document.getElementById(k); if(el) st.f[k] = el.value.trim(); }); const d = document.getElementById('ds'); if(d) st.ds = d.checked; }
  function validate(st){
    grab(st);
    const bad = [];
    ['vorname','nachname'].forEach(k => { if(st.f[k].length<2) bad.push(k); });
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(st.f.email)) bad.push('email');
    if(st.f.tel.replace(/\D/g,'').length<6) bad.push('tel');
    ['vorname','nachname','email','tel'].forEach(k => document.getElementById(k).classList.toggle('bad', bad.indexOf(k)>-1));
    document.getElementById('dsl').classList.toggle('bad', !st.ds);
    let msg = '';
    if(bad.length) msg = st.ds ? 'Bitte prüfe die markierten Felder.' : 'Bitte prüfe die markierten Felder und bestätige die Datenschutzerklärung.';
    else if(!st.ds) msg = 'Bitte bestätige die Datenschutzerklärung.';
    if(msg){ document.getElementById('err').textContent = msg; const f = document.querySelector('input.bad'); if(f) f.focus(); else document.getElementById('ds').focus(); return false; }
    return true;
  }
  function submit(){
    if(!validate(S)) return;
    const o = occ(S.slot);
    if(S.mode==='excl' ? (o.taken>0||o.excl) : o.free<S.persons){ document.getElementById('err').textContent = 'Dieser Termin ist leider gerade belegt worden. Bitte wähle einen anderen.'; return; }
    const q = quote(S), b = {id:'b'+Date.now(), slot:S.slot, club:S.club, mode:S.mode, persons:S.mode==='excl'?1:S.persons, vorname:S.f.vorname, nachname:S.f.nachname, email:S.f.email, tel:S.f.tel, level:S.level, member:S.club==='htv'&&S.member, total:q.total, ts:Date.now()};
    if(S.mode==='excl'){ b.groupSize = S.size; b.code = genCode(); }
    BOOK.push(b); save(BOOK); S.last = b;
    S.f = {vorname:'',nachname:'',email:'',tel:''}; S.ds = false; S.level = ''; S.err = '';
    go(5);
  }
  function ivSubmit(){
    if(!validate(IV)) return;
    const g = groupByCode(IV.code);
    if(!g || !g.o.pending){ render(); return; }
    const pp = T(g.slot.club, g.slot.club==='htv'&&IV.member)[g.lead.groupSize];
    const b = {id:'b'+Date.now(), slot:g.lead.slot, club:g.slot.club, mode:'invite', persons:1, groupSize:g.lead.groupSize, code:g.lead.code, vorname:IV.f.vorname, nachname:IV.f.nachname, email:IV.f.email, tel:IV.f.tel, level:IV.level, member:g.slot.club==='htv'&&IV.member, total:pp*WEEKS, ts:Date.now()};
    BOOK.push(b); save(BOOK); IV.done = b; render(); window.scrollTo(0,0);
  }
  function copy(url, btn){
    const ok = () => { btn.textContent = 'Link kopiert ✓'; setTimeout(() => { btn.textContent = 'Link kopieren'; }, 2000); };
    const fallback = () => { const ta = document.createElement('textarea'); ta.value = url; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); }catch(e){} document.body.removeChild(ta); ok(); };
    if(navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(url).then(ok, fallback); else fallback();
  }

  app.addEventListener('keydown', e => { if((e.key==='Enter'||e.key===' ') && e.target.matches('[data-mode]')){ e.preventDefault(); e.target.click(); } });
  app.addEventListener('input', e => { if(e.target.classList.contains('bad')) e.target.classList.remove('bad'); });
  app.addEventListener('change', e => { if(e.target.id==='ds' && e.target.checked) document.getElementById('dsl').classList.remove('bad'); });
  app.addEventListener('click', e => {
    const t = e.target, act = (t.closest('[data-act]')||{}).getAttribute ? t.closest('[data-act]').getAttribute('data-act') : null;
    if(act==='reset'){ e.preventDefault(); resetDemo(); if(INVITE){ IV.done=null; } S.club=null; S.slot=null; S.last=null; if(ADMIN||INVITE) render(); else go(1); return; }
    if(act==='copy'){ copy(t.closest('[data-act]').getAttribute('data-url'), t.closest('[data-act]')); return; }
    if(act==='wa') return;
    const bk = t.closest('[data-back]'); if(bk){ if(S.step===4) grab(S); S.err=''; go(+bk.getAttribute('data-back')); return; }
    const c = t.closest('[data-club]'); if(c){ const v = c.getAttribute('data-club'); if(S.club!==v){ S.slot=null; S.day=null; } S.club=v; go(2); return; }
    const dy = t.closest('[data-day]'); if(dy){ S.day = +dy.getAttribute('data-day'); render(); return; }
    const sl = t.closest('[data-slot]'); if(sl && !sl.disabled){ S.slot = sl.getAttribute('data-slot'); S.mode='group'; S.persons=1; S.size=2; go(3); return; }
    const p = t.closest('[data-p]'); if(p){ if(!p.disabled){ S.persons += +p.getAttribute('data-p'); render(); } return; }
    const sb = t.closest('.seg button'); if(sb){ const k = sb.parentNode.getAttribute('data-k'), v = sb.getAttribute('data-v');
      if(k==='member') S.member = v==='1';
      if(k==='size') S.size = +v;
      if(k==='ivmember'){ grab(IV); IV.member = v==='1'; }
      if(k==='level'){ const st = INVITE?IV:S; grab(st); st.level = st.level===v ? '' : v; }
      render(); return; }
    const m = t.closest('[data-mode]'); if(m && !m.classList.contains('dis')){ S.mode = m.getAttribute('data-mode'); render(); return; }
    if(act==='toDetails'){ go(4); return; }
    if(act==='again'){ go(2); return; }
    if(act==='submit'){ submit(); return; }
    if(act==='ivsubmit'){ ivSubmit(); return; }
  });

  if(!ADMIN && !INVITE){ try{ history.replaceState({step:1}, '', location.pathname+location.search); }catch(e){} }
  render();
})();
</script>
</body>
</html>
