  :root{--dark:#3D3A36;--olive:#5E6D55;--cream:#F3E8D8;--sand:#D9CDB8;--tan:#B39B72;--grey:#7A746C}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--cream);color:var(--dark);font-family:'Avenir Next','Avenir','Segoe UI',Montserrat,Helvetica,Arial,sans-serif;font-weight:300;-webkit-font-smoothing:antialiased;overflow:hidden}
  html,body{scrollbar-width:none;-ms-overflow-style:none}html::-webkit-scrollbar,body::-webkit-scrollbar{display:none;width:0;height:0}
  .wrap{max-width:960px;margin:0 auto;padding:20px 16px}
  .eyebrow{font-family:Poppins,'Avenir Next','Segoe UI',Montserrat,sans-serif;font-weight:600;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--tan)}
  h2{font-family:Poppins,'Avenir Next','Segoe UI',Montserrat,sans-serif;font-weight:600;font-size:22px;line-height:30px;margin:4px 0 0}
  h2:after{content:"";display:block;width:40px;height:2px;background:var(--olive);margin-top:10px}

  .P{font-family:Poppins,'Avenir Next','Segoe UI',Montserrat,sans-serif;font-weight:600}
  .box{background:#fff;border:1px solid var(--sand);border-radius:14px;box-shadow:0 4px 18px rgba(61,58,54,.08);padding:24px 26px;height:508px;overflow:hidden}
  .head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
  .tabs{display:flex;gap:8px}
  .tabs button{font:inherit;font-size:14px;font-weight:400;color:var(--dark);background:var(--cream);border:1px solid var(--sand);border-radius:8px;height:40px;padding:0 16px;cursor:pointer;transition:all .2s;white-space:nowrap}
  .tabs button:hover{border-color:var(--olive)}
  .tabs button.on{background:var(--olive);border-color:var(--olive);color:#fff;font-family:Poppins,'Avenir Next','Segoe UI',Montserrat,sans-serif;font-weight:600;font-size:13.5px}
  .tabs button:focus-visible,.show:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(94,109,85,.25)}
  .map{position:relative;margin-top:18px;height:340px;border-radius:10px;overflow:hidden;border:1px solid var(--sand);background:var(--cream)}
  .map iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
  .ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:18px}
  .ph svg.bg{position:absolute;inset:0;width:100%;height:100%}
  .addrs{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:560px}
  .ad{background:rgba(255,255,255,.92);border:1px solid var(--sand);border-radius:10px;padding:12px 14px;transition:border-color .2s}
  .ad.on{border-color:var(--olive);box-shadow:0 0 0 1px var(--olive)}
  .ad .nm{font-family:Poppins,'Avenir Next','Segoe UI',Montserrat,sans-serif;font-weight:600;font-size:14px}
  .ad .a{font-size:13.5px;line-height:1.4;margin-top:3px}
  .show{position:relative;font-family:Poppins,'Avenir Next','Segoe UI',Montserrat,sans-serif;font-weight:600;font-size:15px;letter-spacing:.5px;color:#fff;background:var(--olive);border:0;border-radius:8px;height:46px;padding:0 28px;cursor:pointer;display:flex;align-items:center;gap:10px;transition:all .2s}
  .show:hover{background:#4f5d47;transform:translateY(-1px)}
  .show svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:12px;height:20px}
  .note{font-size:12.5px;font-weight:400;color:#1A1A1A;line-height:20px}
  .osm{font-size:12.5px;color:var(--olive);text-decoration:none;border-bottom:1px solid var(--tan);white-space:nowrap;line-height:16px}
  .hide{display:none!important}
.langsw{position:relative;display:flex;justify-content:flex-end;margin:0 0 10px;z-index:40}
.langbtn{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--sand,#D9CDB8);border-radius:20px;padding:5px 10px 5px 8px;cursor:pointer;font-family:Poppins,'Avenir Next',Avenir,Montserrat,Helvetica,Arial,sans-serif;font-weight:600;font-size:12px;line-height:1.2;color:var(--dark,#3D3A36);box-shadow:0 2px 8px rgba(61,58,54,.05)}
.langbtn:hover,.langbtn[aria-expanded="true"]{border-color:var(--olive,#5E6D55)}
.langbtn svg{width:15px;height:15px;stroke:var(--olive,#5E6D55);fill:none;stroke-width:1.7;flex:0 0 auto}
.langmenu{position:absolute;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--sand,#D9CDB8);border-radius:14px;box-shadow:0 10px 28px rgba(61,58,54,.14);padding:6px;min-width:188px}
.langmenu[hidden]{display:none}
.langmenu button{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;background:none;border:0;border-radius:10px;padding:7px 10px;cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:500;color:var(--dark,#3D3A36);text-align:left}
.langmenu button .ln{color:#1A1A1A;font-weight:400;font-size:12.5px}
.langmenu button.on{background:var(--cream,#F3E8D8);color:var(--olive,#5E6D55)}
.langmenu button:hover{background:var(--cream,#F3E8D8)}
@media (max-width:640px){.langbtn{font-size:11.5px;padding:4px 9px 4px 7px}}
  .wrap>.langsw{margin:0 0 8px}

  @media (max-width:640px){
    .wrap{padding:12px 10px}
    .box{padding:18px 16px;height:540px}
    h2{font-size:20px}
    .head{flex-direction:column;align-items:stretch;gap:14px}
    .tabs button{flex:1;font-size:13px;height:40px;padding:0 6px}
    .tabs button.on{font-size:13px}
    .map{margin-top:14px;height:300px}
    .addrs{grid-template-columns:1fr;gap:8px}
    .ad{padding:9px 12px}
    .ph{gap:12px}
    .show{height:44px;font-size:14px;padding:0 22px}
    .foot{flex-direction:column;align-items:flex-start;gap:4px;height:58px;margin-top:10px}
    .ph svg.bg g[transform]{display:none}
    .note{font-size:12px;line-height:18px}
    .osm{font-size:12px}
  }
  @media (max-width:350px){h2{font-size:18px}.box{padding:16px 13px}.tabs button,.tabs button.on{font-size:12.5px}.note{font-size:11.5px}.ad .a{font-size:13px}}
</style>
</head>

  <div class="box">
    <div class="head">
      <div><div class="eyebrow" data-i18n="eyebrow">Anfahrt</div><h2 data-i18n="title">Hier findest du mich</h2></div>

        <button class="on" data-v="htv" role="tab" aria-selected="true" translate="no">Heerdter TV</button>

      </div>
    </div>
    <div class="map" id="map">
      <div class="ph" id="ph">
        <svg class="bg" viewBox="0 0 900 340" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
          <rect width="900" height="340" fill="#F3E8D8"/>

            <path d="M380 -20 C 400 120, 340 220, 420 360"/>
          </g>
          <g transform="translate(470 120) rotate(-8)" fill="none" stroke="#B39B72" stroke-width="2" opacity=".55">

<script>

var ST_LANGS=['de','en','tr','ja','zh','uk'];

  en:{locale:'en-GB',html:'en',label:'EN',name:'English'},
  tr:{locale:'tr-TR',html:'tr',label:'TR',name:'Türkçe'},
  ja:{locale:'ja-JP',html:'ja',label:'日本語',name:'日本語'},

  uk:{locale:'uk-UA',html:'uk',label:'УКР',name:'Українська'}
};
var LANG_KEY='serdartennis_lang';
function normLang(s){ if(!s) return null; s=String(s).toLowerCase().replace(/_/g,'-'); var b=s.split('-')[0]; return LANG_META[b]?b:null; }

  var q=(location.search.match(/[?&]lang=([a-zA-Z-]+)/)||[])[1]; var fq=normLang(q); if(fq) return fq;

function setLang(l,persist){

}

}

var ST_ON_LANG=function(){};
function mountLangSwitcher(host){

      ST_LANGS.map(function(k){ var x=LANG_META[k]; return '<button type="button" role="option" class="'+(k===LANG?'on':'')+'" data-lang="'+k+'" aria-selected="'+(k===LANG)+'" lang="'+x.html+'"><span>'+x.label+'</span><span class="ln">'+x.name+'</span></button>'; }).join('')+'</div>';
  }

  });

}
var stLastH=0;
function stPostHeight(){ try{ var h=Math.ceil(document.documentElement.scrollHeight); if(Math.abs(h-stLastH)<2) return; stLastH=h; window.parent.postMessage({type:'st-height',height:h},'*'); }catch(e){} }
function stFit(sel,ratio){
  document.querySelectorAll(sel).forEach(function(e){
    e.style.fontSize=''; if(!e.offsetParent) return; var fs=parseFloat(getComputedStyle(e).fontSize), min=fs*(ratio||0.85);
    while(e.scrollWidth>e.clientWidth+0.5 && fs>min){ fs-=0.25; e.style.fontSize=fs+'px'; }
  });
}

(function(){
  function render(){ applyStatic(); document.title=T('map'); var f=document.querySelector('.map iframe'); if(f) f.title=T('map'); stFit('.note'); stPostHeight(); }
  ST_ON_LANG=render; mountLangSwitcher(document.getElementById('wrap')); render();
  window.addEventListener('resize',stPostHeight); if(document.fonts&&document.fonts.ready) document.fonts.ready.then(stPostHeight);
})();
(function(){
  var L={htv:{lat:51.23394,lon:6.72424},wet:{lat:51.56893,lon:6.29899}};
  var cur='htv',loaded=false,map=document.getElementById('map'),ph=document.getElementById('ph'),big=document.getElementById('big'),fr=null;
  function src(k){var p=L[k],dx=.009,dy=.0042;return 'https://www.openstreetmap.org/export/embed.html?bbox='+(p.lon-dx).toFixed(5)+'%2C'+(p.lat-dy).toFixed(5)+'%2C'+(p.lon+dx).toFixed(5)+'%2C'+(p.lat+dy).toFixed(5)+'&layer=mapnik&marker='+p.lat+'%2C'+p.lon;}
  function link(k){var p=L[k];return 'https://www.openstreetmap.org/?mlat='+p.lat+'&mlon='+p.lon+'#map=17/'+p.lat+'/'+p.lon;}
  function sel(k){cur=k;document.querySelectorAll('.tabs button').forEach(function(b){var on=b.dataset.v===k;b.classList.toggle('on',on);b.setAttribute('aria-selected',on)});
    document.querySelectorAll('.ad').forEach(function(a){a.classList.toggle('on',a.dataset.v===k)});
    if(loaded){fr.src=src(k);big.href=link(k);}}
  document.querySelectorAll('.tabs button').forEach(function(b){b.addEventListener('click',function(){sel(b.dataset.v)})});
  document.querySelectorAll('.ad').forEach(function(a){a.style.cursor='pointer';a.addEventListener('click',function(){sel(a.dataset.v)})});
  document.getElementById('show').addEventListener('click',function(){
    loaded=true;fr=document.createElement('iframe');fr.title=T('map');fr.loading='lazy';fr.referrerPolicy='no-referrer';fr.src=src(cur);
