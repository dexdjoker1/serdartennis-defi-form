<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Defi Liga – Ablauf</title><link rel="stylesheet" href="fonts/liga.css"><style>html,body{margin:0;background:transparent;font-family:'Nunito Sans','Avenir',Arial,sans-serif}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:28px 24px;padding:4px}.s{position:relative;background:#D9CDB8;border:1px solid #D9CDB8;border-radius:4px;padding:22px 20px 20px;box-sizing:border-box}.n{width:46px;height:46px;border:2px solid #5E6D55;border-radius:50%;color:#5E6D55;font:700 16px/42px Montserrat,Arial,sans-serif;text-align:center;margin-bottom:14px}h3{margin:0 0 8px;color:#3D3A36;font:700 18px Montserrat,Arial,sans-serif}p{margin:0;color:#1A1A1A;font-size:15px;line-height:1.5;font-weight:400}@media(max-width:620px){.g{grid-template-columns:1fr;gap:14px}.s{padding:16px 16px 16px 76px;min-height:78px}.n{position:absolute;left:16px;top:16px;margin:0}.s:not(:last-child):after{content:'';position:absolute;left:38px;bottom:-15px;width:2px;height:16px;background:#5E6D55}p{font-size:16px}}

<script>
(function(){

  en:{locale:'en-GB',html:'en',label:'EN',name:'English'},
  tr:{locale:'tr-TR',html:'tr',label:'TR',name:'Türkçe'},
  ja:{locale:'ja-JP',html:'ja',label:'日本語',name:'日本語'},
  zh:{locale:'zh-CN',html:'zh-CN',label:'中文',name:'简体中文'},
  uk:{locale:'uk-UA',html:'uk',label:'УКР',name:'Українська'}
};
var LANG_KEY='serdartennis_lang_v2';
function normLang(s){ if(!s) return null; s=String(s).toLowerCase().replace(/_/g,'-'); var b=s.split('-')[0]; return LANG_META[b]?b:null; }

var ST_ON_LANG=function(){};
function mountLangSwitcher(host){
  var w=document.createElement('div'); w.className='langsw';
  function build(){
    var m=LANG_META[LANG];
    w.innerHTML='<button type="button" class="langbtn" aria-haspopup="listbox" aria-expanded="false" aria-label="'+stEsc(T('lang_label'))+'"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg><span>'+m.label+'</span></button><div class="langmenu" hidden role="listbox">'+

  }
  function close(){ var mn=w.querySelector('.langmenu'), b=w.querySelector('.langbtn'); if(mn&&!mn.hidden){ mn.hidden=true; b.setAttribute('aria-expanded','false'); } }

    e.stopPropagation();
    var o=e.target.closest('[data-lang]');

    if(e.target.closest('.langbtn')){ var mn=w.querySelector('.langmenu'), b=w.querySelector('.langbtn'); mn.hidden=!mn.hidden; b.setAttribute('aria-expanded',String(!mn.hidden)); }

  document.addEventListener('keydown',function(e){ if(e.key==='Escape') close(); });

}
var stLastH=0;
function stPostHeight(){ try{ var h=Math.ceil(document.documentElement.scrollHeight); if(Math.abs(h-stLastH)<2) return; stLastH=h; window.parent.postMessage({type:'st-height',height:h},'*'); }catch(e){} }
function stFit(sel,ratio){
  document.querySelectorAll(sel).forEach(function(e){
    e.style.fontSize=''; if(!e.offsetParent) return; var fs=parseFloat(getComputedStyle(e).fontSize), min=fs*(ratio||0.85);
    while(e.scrollWidth>e.clientWidth+0.5 && fs>min){ fs-=0.25; e.style.fontSize=fs+'px'; }
  });
}
var I18N={"de": {"lang_label": "Sprache wählen", "title": "Defi Liga – Ablauf", "t1": "Melde dich an", "p1": "Füll das Formular „Anmeldung Defi Liga“ aus. Das Startgeld ist {fee}.", "t2": "Auslosung", "p2": "Zum Start der Liga wird die Reihenfolge ausgelost. Alle starten mit 0 Punkten.", "t3": "Fordern", "p3": "Such dir einen Gegner, der bis zu 2 Plätze über dir steht. Er antwortet innerhalb von 2 Tagen.", "t4": "Spielen", "p4": "Ihr macht Tag und Uhrzeit selbst aus und spielt innerhalb von 14 Tagen.", "t5": "Ergebnis melden", "p5": "Der Gewinner meldet das Ergebnis über das Formular „Ergebnis melden“. Der andere Spieler kann innerhalb von 2 Tagen widersprechen.", "t6": "Rangliste", "p6": "Deine Punkte siehst du live in der Rangliste."}, "en": {"lang_label": "Choose language", "title": "Defi Liga – How it works", "t1": "Sign up", "p1": "Fill in the “Defi Liga sign-up” form. The entry fee is {fee}.", "t2": "Draw", "p2": "At the start of the league, the order is decided by drawing lots. Everyone starts with 0 points.", "t3": "Challenge", "p3": "Pick an opponent ranked up to 2 places above you. They reply within 2 days.", "t4": "Play", "p4": "You arrange the day and time yourselves and play within 14 days.", "t5": "Report the result", "p5": "The winner reports the result using the “Report result” form. The other player can object within 2 days.", "t6": "Ranking", "p6": "You can see your points live in the ranking."}, "tr": {"lang_label": "Dil seçin", "title": "Defi Liga – Nasıl işler?", "t1": "Kaydolun", "p1": "“Defi Liga Kaydı” formunu doldurun. Katılım ücreti {fee}.", "t2": "Kura", "p2": "Lig başlarken sıralama kurayla belirlenir. Herkes 0 puanla başlar.", "t3": "Meydan okuyun", "p3": "Sıralamada sizden en fazla 2 basamak yukarıda olan bir rakip seçin. Rakibiniz 2 gün içinde yanıt verir.", "t4": "Oynayın", "p4": "Günü ve saati kendi aranızda belirler, maçı 14 gün içinde oynarsınız.", "t5": "Sonucu bildirin", "p5": "Kazanan, sonucu “Sonuç bildir” formuyla bildirir. Di var WA=/(Defi Liga)/g;
function render(){
  document.title=T('title');
  document.querySelectorAll('[data-k]').forEach(function(e){ e.innerHTML=stEsc(T(e.getAttribute('data-k'),{fee:eurFmt(5000,0)})).replace(WA,'<span translate="no">$1</span>'); });

}
