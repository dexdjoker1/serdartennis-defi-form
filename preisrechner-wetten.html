  :root{--dark:#3D3A36;--olive:#5E6D55;--cream:#F3E8D8;--sand:#D9CDB8;--tan:#B39B72;--grey:#7A746C}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--cream);color:var(--dark);font-family:'Avenir Next','Avenir','Segoe UI',Montserrat,Helvetica,Arial,sans-serif;font-weight:300;-webkit-font-smoothing:antialiased;overflow:hidden}
  html,body{scrollbar-width:none;-ms-overflow-style:none}html::-webkit-scrollbar,body::-webkit-scrollbar{display:none;width:0;height:0}
  .wrap{max-width:960px;margin:0 auto;padding:20px 16px}
  .box{display:grid;grid-template-columns:1.15fr 1fr;background:#fff;border:1px solid var(--sand);border-radius:14px;overflow:hidden;box-shadow:0 4px 18px rgba(61,58,54,.08)}
  .left{padding:28px 30px}
  .eyebrow{font-family:Poppins,sans-serif;font-weight:600;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--tan)}
  h2{font-family:Poppins,sans-serif;font-weight:600;font-size:22px;margin:4px 0 0}
  h2:after{content:"";display:block;width:40px;height:2px;background:var(--olive);margin-top:10px}
  .q{margin-top:20px}
  .lbl{font-size:14px;font-weight:400;color:#1A1A1A;margin-bottom:8px;height:18px;line-height:18px}
  .seg{display:flex;gap:8px}
  .seg button{flex:1;font:inherit;font-size:15px;font-weight:400;color:var(--dark);background:var(--cream);border:1px solid var(--sand);border-radius:8px;height:44px;cursor:pointer;transition:all .2s;white-space:nowrap;padding:0 6px}
  .seg button:hover{border-color:var(--olive)}
  .seg button.on{background:var(--olive);border-color:var(--olive);color:#fff;font-family:Poppins,sans-serif;font-weight:600;font-size:14px}
  .seg button:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(94,109,85,.25)}
  .info{height:44px;display:flex;align-items:center;padding:0 14px;border:1.5px dashed var(--sand);border-radius:8px;font-size:14px;font-weight:400;color:#1A1A1A}
  .hide{display:none!important}
  .langsw{margin:0 0 8px}
.langsw{position:relative;display:flex;justify-content:flex-end;margin:0 0 10px;z-index:40}
.langbtn{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--sand,#D9CDB8);border-radius:20px;padding:5px 10px 5px 8px;cursor:pointer;font-family:Poppins,'Avenir Next',Avenir,Montserrat,Helvetica,Arial,sans-serif;font-weight:600;font-size:12px;line-height:1.2;color:var(--dark,#3D3A36);box-shadow:0 2px 8px rgba(61,58,54,.05)}
.langbtn:hover,.langbtn[aria-expanded="true"]{border-color:var(--olive,#5E6D55)}
.langbtn svg{width:15px;height:15px;stroke:var(--olive,#5E6D55);fill:none;stroke-width:1.7;flex:0 0 auto}
.langmenu{position:absolute;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--sand,#D9CDB8);border-radius:14px;box-shadow:0 10px 28px rgba(61,58,54,.14);padding:6px;min-width:188px}
.langmenu[hidden]{display:none}
.langmenu button{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;background:none;border:0;border-radius:10px;padding:7px 10px;cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:500;color:var(--dark,#3D3A36);text-align:left}
.langmenu button .ln{color:#1A1A1A;font-weight:400;font-size:12.5px}
.langmenu button.on{background:var(--cream,#F3E8D8);color:var(--olive,#5E6D55)}
.langmenu button:hover{background:var(--cream,#F3E8D8)}
@media (max-width:640px){.langbtn{font-size:11.5px;padding:4px 9px 4px 7px}}

  .right{background:var(--olive);color:#fff;padding:28px 30px;display:flex;flex-direction:column}
  .rl{font-size:13px;letter-spacing:1.5px;text-transform:uppercase;opacity:.8;font-family:Poppins,sans-serif;font-weight:600}
  .big{font-family:Poppins,sans-serif;font-weight:600;font-size:46px;line-height:1.1;margin-top:6px;letter-spacing:-.5px}
  .unit{font-size:15px;opacity:.85;margin-top:2px}
  .line{height:1px;background:rgba(255,255,255,.25);margin:18px 0}
  .tot{font-family:Poppins,sans-serif;font-weight:600;font-size:26px;margin-top:4px}
  .basis{font-size:13px;opacity:.8;margin-top:4px;line-height:1.4}
  .note{display:inline-block;margin-top:14px;background:rgba(255,255,255,.14);border-radius:20px;padding:5px 12px;font-size:13px;align-self:flex-start}
  .cta{margin-top:auto;display:block;text-align:center;text-decoration:none;background:var(--cream);color:var(--dark);font-family:Poppins,sans-serif;font-weight:600;font-size:15px;letter-spacing:.5px;border-radius:8px;height:48px;line-height:48px;transition:all .2s}
  .cta:hover{background:#fff;transform:translateY(-1px)}
  .sp{height:18px;flex:0 0 auto}
  .fade{transition:opacity .18s}
  .fade.out{opacity:.25}
  @media (max-width:640px){
    .wrap{padding:12px 10px}
    .box{grid-template-columns:1fr}
    .left{padding:20px 18px}
    .right{padding:20px 18px}
    h2{font-size:20px}
    .q{margin-top:16px}
    .seg{gap:6px}
    .seg button{font-size:13px;height:42px}
    .seg button.on{font-size:13px}
    .info{height:42px;font-size:13px}
    .big{font-size:38px}
    .tot{font-size:22px}
    .line{margin:14px 0}
    .note{display:flex;align-items:center;align-self:stretch;height:44px;border-radius:10px;line-height:1.3;font-size:12.5px}
  }
  .tight .seg{gap:5px}.tight .seg button,.tight .seg button.on{padding:0 2px;font-size:12px;letter-spacing:-.1px}
  @media (max-width:350px){h2{font-size:18px}.basis{font-size:12px}.seg button,.seg button.on{font-size:12.5px}}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="box">
    <div class="left">
      <div class="eyebrow" data-i18n="eyebrow">Preisrechner</div>
      <h2 data-i18n="title">Was kostet dein Training?</h2>
      <div class="q">
        <div class="lbl" data-i18n="where">Wo möchtest du spielen?</div>
        <div class="seg" data-k="club">
          <button data-v="htv" translate="no">Heerdter TV</button>
          <button data-v="wet" translate="no">SV Union Wetten</button>
        </div>
      </div>
      <div class="q">
        <div class="lbl" id="memLbl">Bist du Mitglied im Heerdter TV?</div>
        <div class="seg" data-k="mem" id="memSeg">
          <button data-v="ja" data-i18n="yes">Ja</button>
          <button data-v="nein" data-i18n="no">Nein</button>
        </div>
        <div class="info hide" id="memInfo" data-i18n="wet_info">In Wetten gilt für alle derselbe Preis.</div>
      </div>
      <div class="q">
        <div class="lbl" data-i18n="size_q">Wie viele Personen seid ihr?</div>
        <div class="seg" data-k="size">
          <button data-v="1" data-i18n="s1">Einzel</button>
          <button data-v="2" data-i18n="s2">zu zweit</button>
          <button data-v="3" data-i18n="s3">zu dritt</button>
          <button data-v="4" data-i18n="s4">zu viert</button>
        </div>
      </div>
    </div>
    <div class="right">
      <div class="fade" id="res">
        <div class="rl" data-i18n="pp">Pro Person und Training</div>
        <div class="big" id="pp">12,50 €</div>
        <div class="line"></div>
        <div class="rl" data-i18n="total">Sommersaison gesamt</div>
        <div class="tot" id="tot">300,00 €</div>
        <div class="basis" id="basis">20 Trainingswochen, 1 Training pro Woche</div>
        <div class="note" id="note">ohne Platzgebühr</div>
      </div>
    </div>
  </div>
</div>
<script>
(function(){
/* ST i18n core (shared pattern with anmelden.html) */
var ST_LANGS=['de','en','tr','ja','zh','uk'];
var LANG_META={
  de:{locale:'de-DE',html:'de',label:'DE',name:'Deutsch'},
  en:{locale:'en-GB',html:'en',label:'EN',name:'English'},
  tr:{locale:'tr-TR',html:'tr',label:'TR',name:'Türkçe'},
  ja:{locale:'ja-JP',html:'ja',label:'日本語',name:'日本語'},
  zh:{locale:'zh-CN',html:'zh-CN',label:'中文',name:'简体中文'},
  uk:{locale:'uk-UA',html:'uk',label:'УКР',name:'Українська'}
};
var LANG_KEY='serdartennis_lang_v2';
function normLang(s){ if(!s) return null; s=String(s).toLowerCase().replace(/_/g,'-'); var b=s.split('-')[0]; return LANG_META[b]?b:null; }
function detectLang(){
  var q=(location.search.match(/[?&]lang=([a-zA-Z-]+)/)||[])[1]; var fq=normLang(q); if(fq) return fq;
  try{ var sv=localStorage.getItem(LANG_KEY); if(sv&&LANG_META[sv]) return sv; }catch(e){}
  return 'de';
}
var LANG=detectLang(), LOCALE=LANG_META[LANG].locale;
document.documentElement.lang=LANG_META[LANG].html;
function setLang(l,persist){
  if(!LANG_META[l]) l='de'; LANG=l; LOCALE=LANG_META[l].locale; document.documentElement.lang=LANG_META[l].html;
  if(persist!==false){ try{ localStorage.setItem(LANG_KEY,l); }catch(e){} }
  try{ var u=new URL(location.href); u.searchParams.set('lang',l); history.replaceState(history.state,'',u.pathname+u.search+u.hash); }catch(e){}
}
function T(key,vars){
  var p=I18N[LANG]||I18N.de, s=p[key]; if(s==null) s=I18N.de[key]; if(s==null) return key;
  if(vars) s=s.replace(/\{(\w+)\}/g,function(_,k){ return vars[k]==null?'':vars[k]; });
  return s;
}
function stEsc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function eurFmt(cents,min){ var v=cents/100; return new Intl.NumberFormat(LOCALE,{style:'currency',currency:'EUR',currencyDisplay:'narrowSymbol',minimumFractionDigits:min==null?2:min,maximumFractionDigits:min==null?2:(v%1?2:min)}).format(v); }
function dateFmt(y,m,d,opt){ return new Intl.DateTimeFormat(LOCALE,Object.assign({timeZone:'UTC'},opt)).format(new Date(Date.UTC(y,m-1,d))); }
function applyStatic(root){
  (root||document).querySelectorAll('[data-i18n]').forEach(function(e){ e.textContent=T(e.getAttribute('data-i18n')); });
  (root||document).querySelectorAll('[data-i18n-html]').forEach(function(e){ e.innerHTML=T(e.getAttribute('data-i18n-html')); });
}
var ST_ON_LANG=function(){};
function mountLangSwitcher(host){
  var w=document.createElement('div'); w.className='langsw';
  function build(){
    var m=LANG_META[LANG];
    w.innerHTML='<button type="button" class="langbtn" aria-haspopup="listbox" aria-expanded="false" aria-label="'+stEsc(T('lang_label'))+'"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg><span>'+m.label+'</span></button><div class="langmenu" hidden role="listbox">'+
      ST_LANGS.map(function(k){ var x=LANG_META[k]; return '<button type="button" role="option" class="'+(k===LANG?'on':'')+'" data-lang="'+k+'" aria-selected="'+(k===LANG)+'" lang="'+x.html+'"><span>'+x.label+'</span><span class="ln">'+x.name+'</span></button>'; }).join('')+'</div>';
  }
  function close(){ var mn=w.querySelector('.langmenu'), b=w.querySelector('.langbtn'); if(mn&&!mn.hidden){ mn.hidden=true; b.setAttribute('aria-expanded','false'); } }
  w.addEventListener('click',function(e){
    e.stopPropagation();
    var o=e.target.closest('[data-lang]');
    if(o){ var l=o.getAttribute('data-lang'); close(); if(l!==LANG){ setLang(l); build(); ST_ON_LANG(); } return; }
    if(e.target.closest('.langbtn')){ var mn=w.querySelector('.langmenu'), b=w.querySelector('.langbtn'); mn.hidden=!mn.hidden; b.setAttribute('aria-expanded',String(!mn.hidden)); }
  });
  document.addEventListener('click',close);
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') close(); });
  window.addEventListener('storage',function(e){ if(e.key===LANG_KEY&&LANG_META[e.newValue]&&e.newValue!==LANG){ setLang(e.newValue,false); build(); ST_ON_LANG(); } });
  build(); host.insertBefore(w,host.firstChild);
  return {rebuild:build};
}
var stLastH=0;
function stPostHeight(){ try{ var h=Math.ceil(document.documentElement.scrollHeight); if(Math.abs(h-stLastH)<2) return; stLastH=h; window.parent.postMessage({type:'st-height',height:h},'*'); }catch(e){} }
function stFit(sel,ratio){
  document.querySelectorAll(sel).forEach(function(e){
    e.style.fontSize=''; if(!e.offsetParent) return; var fs=parseFloat(getComputedStyle(e).fontSize), min=fs*(ratio||0.85);
    while(e.scrollWidth>e.clientWidth+0.5 && fs>min){ fs-=0.25; e.style.fontSize=fs+'px'; }
  });
}

  var URL = { htv:'https://akdagserdar47.wixsite.com/serdartennis/heerdter-tv',
              wet:'https://akdagserdar47.wixsite.com/serdartennis/sv-union-wetten' };
  // Preis pro Person und Training in Cent
  var MEMBER = {1:5000, 2:2500, 3:1667, 4:1250};
  var GUEST  = {1:6000, 2:3000, 3:2000, 4:1500};
  var WEEKS = 20;
  var s = { club:'wet', mem:'ja', size:'4' };

  function eur(c){ return eurFmt(c); }
  function calc(st){
    var member = st.club==='htv' && st.mem==='ja';
    var pp = (member ? MEMBER : GUEST)[st.size];
    return { member:member, pp:pp, total:pp*WEEKS };
  }
  window.__calc = function(club,mem,size){ var r = calc({club:club,mem:mem,size:String(size)}); return {pp:eur(r.pp), total:eur(r.total), member:r.member}; };

  function render(anim){
    document.querySelectorAll('.seg').forEach(function(g){
      var k = g.getAttribute('data-k');
      g.querySelectorAll('button').forEach(function(b){
        var on = b.getAttribute('data-v')===s[k];
        b.classList.toggle('on', on); b.setAttribute('aria-pressed', on);
      });
    });
    var wet = s.club==='wet';
    document.getElementById('memSeg').classList.toggle('hide', wet);
    document.getElementById('memInfo').classList.toggle('hide', !wet);
    document.getElementById('memLbl').innerHTML = wet ? stEsc(T('mem')) : T('mem_q',{club:'<span translate="no">Heerdter TV</span>'});
    applyStatic(); document.getElementById('basis').textContent = T('basis',{n:WEEKS});
    var r = calc(s);
    var res = document.getElementById('res');
    function apply(){
      document.getElementById('pp').textContent = eur(r.pp);
      document.getElementById('tot').textContent = eur(r.total);
      document.getElementById('note').textContent = r.member ? T('fee_none') : T('fee_incl',{fee:eurFmt(1000,0)});
      fitBox();
      stPostHeight();
      res.classList.remove('out');
    }
    if(anim){ res.classList.add('out'); setTimeout(apply,150); } else apply();
  }
  document.querySelectorAll('.seg').forEach(function(g){
    g.addEventListener('click', function(e){
      var b = e.target.closest('button'); if(!b) return;
      s[g.getAttribute('data-k')] = b.getAttribute('data-v'); render(true);
    });
  });
  // only kicks in when the box would be wider than the frame (e.g. German at 300 px)
  function fitBox(){
    var box=document.querySelector('.box'); document.body.classList.remove('tight');
    if(box.scrollWidth>box.clientWidth+0.5) document.body.classList.add('tight');
  }
  window.addEventListener('resize',function(){ fitBox(); requestAnimationFrame(function(){ fitBox(); stPostHeight(); }); }); if(document.fonts&&document.fonts.ready) document.fonts.ready.then(function(){fitBox(); stPostHeight();}); if(document.fonts&&document.fonts.addEventListener) document.fonts.addEventListener('loadingdone',function(){fitBox(); stPostHeight();}); if(window.ResizeObserver){ var stRO=new ResizeObserver(function(){ fitBox(); stPostHeight(); }); document.querySelectorAll('.seg button,.box h2,.box .info').forEach(function(e){ stRO.observe(e); }); }
