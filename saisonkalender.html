  :root{--dark:#3D3A36;--olive:#5E6D55;--cream:#F3E8D8;--sand:#D9CDB8;--tan:#B39B72;--grey:#7A746C;--gold:#C8A24A}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--cream);color:var(--dark);font-family:'Avenir Next','Avenir','Segoe UI',Montserrat,Helvetica,Arial,sans-serif;font-weight:300;-webkit-font-smoothing:antialiased;overflow:hidden}
  html,body{scrollbar-width:none;-ms-overflow-style:none}html::-webkit-scrollbar,body::-webkit-scrollbar{display:none;width:0;height:0}
  .wrap{max-width:960px;margin:0 auto;padding:20px 16px}
  .box{background:#fff;border:1px solid var(--sand);border-radius:14px;box-shadow:0 4px 18px rgba(61,58,54,.08);padding:28px 30px 26px}
  .head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px}
  .eyebrow{font-family:Poppins,sans-serif;font-weight:600;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--tan)}
  h2{font-family:Poppins,sans-serif;font-weight:600;font-size:22px;margin:4px 0 0}
  h2:after{content:"";display:block;width:40px;height:2px;background:var(--olive);margin-top:10px}
  .stat{text-align:right}
  .stat b{font-family:Poppins,sans-serif;font-weight:600;font-size:34px;color:var(--olive);line-height:1}
  .stat span{display:block;font-size:13px;font-weight:400;color:#1A1A1A;margin-top:2px}
  /* Desktop timeline */
  .tl{position:relative;margin-top:26px;padding-left:96px}
  .months{position:relative;height:22px;border-bottom:1px solid var(--sand)}
  .months div{position:absolute;top:0;height:22px;font-family:Poppins,sans-serif;font-weight:600;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#1A1A1A;padding-left:6px;border-left:1px solid var(--sand)}
  .grid{position:absolute;left:96px;right:0;top:0;bottom:0;pointer-events:none}
  .grid i{position:absolute;top:22px;bottom:0;border-left:1px dashed rgba(217,205,184,.7)}
  .row{position:relative;height:78px}
  .rlabel{position:absolute;left:-96px;top:0;width:88px;height:78px;display:flex;align-items:center;font-family:Poppins,sans-serif;font-weight:600;font-size:13px}
  .bar{position:absolute;top:24px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:400;white-space:nowrap;overflow:hidden}
  .b-train{background:var(--olive);color:#fff}
  .b-pause{background:repeating-linear-gradient(45deg,var(--cream),var(--cream) 6px,#EADCC6 6px,#EADCC6 12px);color:#1A1A1A;border:1px solid var(--sand)}
  .b-liga{background:var(--tan);color:#fff}
  .b-play{background:var(--dark);color:#fff}
  .cap{position:absolute;font-size:12px;font-weight:400;color:#1A1A1A;white-space:nowrap;line-height:1.35;text-align:center;background:#fff;padding:0 3px}
  .cap.t{top:4px}.cap.bt{top:58px}
  .cap strong{font-family:Poppins,sans-serif;font-weight:600;color:var(--dark)}
  .flag{position:absolute;top:22px;z-index:1;width:34px;height:34px;border-radius:50%;background:var(--gold);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 4px #fff,0 2px 8px rgba(61,58,54,.2)}
  .legend{display:flex;gap:22px;flex-wrap:wrap;margin-top:12px;padding-top:14px;border-top:1px solid var(--sand);font-size:13px;font-weight:400;color:#1A1A1A}
  .legend span{display:inline-flex;align-items:center;gap:8px}
  .legend i{display:inline-block;width:18px;height:10px;border-radius:5px}
  .legend em{font-style:normal}
  .legend em span{display:inline}
  .langsw{margin:0 0 8px}
.langsw{position:relative;display:flex;justify-content:flex-end;margin:0 0 10px;z-index:40}
.langbtn{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--sand,#D9CDB8);border-radius:20px;padding:5px 10px 5px 8px;cursor:pointer;font-family:Poppins,'Avenir Next',Avenir,Montserrat,Helvetica,Arial,sans-serif;font-weight:600;font-size:12px;line-height:1.2;color:var(--dark,#3D3A36);box-shadow:0 2px 8px rgba(61,58,54,.05)}
.langbtn:hover,.langbtn[aria-expanded="true"]{border-color:var(--olive,#5E6D55)}
.langbtn svg{width:15px;height:15px;stroke:var(--olive,#5E6D55);fill:none;stroke-width:1.7;flex:0 0 auto}
.langmenu{position:absolute;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--sand,#D9CDB8);border-radius:14px;box-shadow:0 10px 28px rgba(61,58,54,.14);padding:6px;min-width:188px}
.langmenu[hidden]{display:none}
.langmenu button{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;background:none;border:0;border-radius:10px;padding:7px 10px;cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:500;color:var(--dark,#3D3A36);text-align:left}
.langmenu button .ln{color:#1A1A1A;font-weight:400;font-size:12.5px}
.langmenu button.on{background:var(--cream,#F3E8D8);color:var(--olive,#5E6D55)}
.langmenu button:hover{background:var(--cream,#F3E8D8)}
@media (max-width:640px){.langbtn{font-size:11.5px;padding:4px 9px 4px 7px}}
  /* Mobile list */
  .vl{display:none}
  @media (max-width:640px){
    .wrap{padding:12px 10px}
    .box{padding:20px 18px}
    h2{font-size:20px}
    .head{flex-direction:column;align-items:flex-start;gap:12px}
    .stat{text-align:left;display:flex;align-items:baseline;gap:6px;background:var(--cream);border-radius:20px;padding:4px 12px}
    .stat b{font-size:18px}.stat span{display:inline;margin:0}
    .tl,.legend{display:none}
    .vl{display:block;margin-top:18px;position:relative}
    .vl:before{content:"";position:absolute;left:61px;top:8px;bottom:8px;width:2px;background:var(--sand)}
    .it{display:grid;grid-template-columns:44px 20px 1fr;column-gap:8px;height:52px;position:relative;white-space:nowrap}
    .it.pause{height:62px}.it.last{height:38px}
    .mo{font-family:Poppins,sans-serif;font-weight:600;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#1A1A1A;padding-top:3px;text-align:right}
    .dot{width:14px;height:14px;border-radius:50%;margin:3px 0 0 3px;position:relative;z-index:1;box-shadow:0 0 0 3px #fff}
    .txt{padding-bottom:0;overflow:hidden;text-overflow:ellipsis}
    .txt b{display:block;overflow:hidden;text-overflow:ellipsis;font-family:Poppins,sans-serif;font-weight:600;font-size:14px;line-height:1.3}
    .txt span span{display:inline;margin:0;font-size:inherit}
    .txt > span{display:block;overflow:hidden;text-overflow:ellipsis;font-size:12px;font-weight:400;color:#1A1A1A;line-height:1.35;margin-top:2px;letter-spacing:-0.1px}
    .it.pause .txt{background:repeating-linear-gradient(45deg,var(--cream),var(--cream) 6px,#EFE3D0 6px,#EFE3D0 12px);border-radius:8px;padding:6px 10px;height:50px;margin-top:-6px}
  }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="box">
    <div class="head">
      <div>
        <div class="eyebrow" data-i18n="eyebrow">HTV Saisonkalender</div>
        <h2 data-i18n="title">Sommersaison 2027</h2>
      </div>
      <div class="stat"><b>20</b><span data-i18n="weeks_lbl">Trainingswochen</span></div>
    </div>

    <div class="tl" id="tl">
      <div class="grid" id="grid"></div>
      <div class="months" id="months"></div>
      <div class="row" id="rowTrain"><div class="rlabel" data-i18n="r_train">Training</div></div>
      <div class="row" id="rowLiga" style="height:94px"><div class="rlabel" translate="no">Defi Liga</div></div>
    </div>
    <div class="legend">
