  :root{--dark:#3D3A36;--olive:#5E6D55;--cream:#F3E8D8;--sand:#D9CDB8;--tan:#B39B72;--grey:#7A746C}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--cream);color:var(--dark);font-family:'Avenir Next','Avenir','Segoe UI',Montserrat,Helvetica,Arial,sans-serif;font-weight:300;-webkit-font-smoothing:antialiased;overflow:hidden}
  html,body{scrollbar-width:none;-ms-overflow-style:none}html::-webkit-scrollbar,body::-webkit-scrollbar{display:none;width:0;height:0}
  .wrap{max-width:960px;margin:0 auto;padding:20px 16px}
  .eyebrow{font-family:Poppins,sans-serif;font-weight:600;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--tan)}
  h2{font-family:Poppins,sans-serif;font-weight:600;font-size:22px;line-height:30px;margin:4px 0 0}
  h2:after{content:"";display:block;width:40px;height:2px;background:var(--olive);margin-top:10px}

  .grid{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:200px;gap:12px;margin-top:20px}
  .t{position:relative;display:block;border:0;padding:0;border-radius:12px;overflow:hidden;background:var(--sand);cursor:zoom-in;box-shadow:0 4px 18px rgba(61,58,54,.08);-webkit-tap-highlight-color:transparent}
  .t img{display:block;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.001);transition:opacity .5s ease,transform .6s cubic-bezier(.2,.7,.2,1)}
  .t img.ok{opacity:1}
  .t:after{content:"";position:absolute;inset:0;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(61,58,54,.06);background:linear-gradient(180deg,rgba(61,58,54,0) 60%,rgba(61,58,54,.18));opacity:0;transition:opacity .3s}
  .t:hover img{transform:scale(1.05)}
  .t:hover:after{opacity:1}
  .t:focus-visible{outline:2px solid var(--olive);outline-offset:3px}
  .more{display:none}
.langsw{position:relative;display:flex;justify-content:flex-end;margin:0 0 10px;z-index:40}
.langbtn{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--sand,#D9CDB8);border-radius:20px;padding:5px 10px 5px 8px;cursor:pointer;font-family:Poppins,'Avenir Next',Avenir,Montserrat,Helvetica,Arial,sans-serif;font-weight:600;font-size:12px;line-height:1.2;color:var(--dark,#3D3A36);box-shadow:0 2px 8px rgba(61,58,54,.05)}
.langbtn:hover,.langbtn[aria-expanded="true"]{border-color:var(--olive,#5E6D55)}
.langbtn svg{width:15px;height:15px;stroke:var(--olive,#5E6D55);fill:none;stroke-width:1.7;flex:0 0 auto}
.langmenu{position:absolute;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--sand,#D9CDB8);border-radius:14px;box-shadow:0 10px 28px rgba(61,58,54,.14);padding:6px;min-width:188px}
.langmenu[hidden]{display:none}
.langmenu button{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;background:none;border:0;border-radius:10px;padding:7px 10px;cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:500;color:var(--dark,#3D3A36);text-align:left}
.langmenu button .ln{color:#1A1A1A;font-weight:400;font-size:12.5px}
.langmenu button.on{background:var(--cream,#F3E8D8);color:var(--olive,#5E6D55)}
.langmenu button:hover{background:var(--cream,#F3E8D8)}
@media (max-width:640px){.langbtn{font-size:11.5px;padding:4px 9px 4px 7px}}
  .wrap>.langsw{margin:0 0 8px}


  /* Lightbox, inside the iframe */
  .lb{position:fixed;inset:0;z-index:10;background:rgba(43,41,38,.96);display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s;touch-action:pan-y}
  .lb.on{opacity:1;visibility:visible}
  .lb figure{position:absolute;inset:56px 72px 52px;display:flex;align-items:center;justify-content:center}
  .lb img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;box-shadow:0 10px 40px rgba(0,0,0,.35);transition:opacity .2s}
  .lb img.ld{opacity:0}
  .lb .cap{position:absolute;left:16px;right:16px;bottom:14px;text-align:center;color:#F3E8D8;font-size:14px;line-height:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lb .cnt{position:absolute;left:18px;top:18px;font-family:Poppins,sans-serif;font-weight:600;font-size:12px;letter-spacing:2px;color:var(--tan)}
  .lb button{position:absolute;border:0;background:rgba(243,232,216,.12);color:#F3E8D8;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .2s}
  .lb button:hover{background:rgba(243,232,216,.24)}
  .lb button:focus-visible{outline:2px solid var(--tan);outline-offset:2px}
  .lb svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .lb .x{top:8px;right:10px}
  .lb .pv{left:14px;top:50%;margin-top:-22px}
  .lb .nx{right:14px;top:50%;margin-top:-22px}

  @media (max-width:640px){
    .wrap{padding:12px 10px}
    h2{font-size:20px}
    .grid{grid-template-columns:1fr 1fr;grid-auto-rows:150px;gap:8px;margin-top:16px}
    .t,.t:after{border-radius:10px}
    .t:nth-child(n+9){display:none}
    .t:nth-child(8) .more{display:flex;position:absolute;inset:0;z-index:1;align-items:center;justify-content:center;background:rgba(61,58,54,.55);color:#fff;font-family:Poppins,sans-serif;font-weight:600;font-size:22px;letter-spacing:1px}
    .lb figure{inset:56px 8px 64px}
    .lb .pv,.lb .nx{top:auto;bottom:8px;margin-top:0}
    .lb .pv{left:10px}.lb .nx{right:10px}
    .lb .cap{left:64px;right:64px;bottom:19px;font-size:13px;white-space:normal;line-height:17px;max-height:34px}
  }
  @media (max-width:350px){h2{font-size:18px}.grid{grid-auto-rows:140px}}
  @media (prefers-reduced-motion:reduce){.t img,.lb,.lb img{transition:none}}
</style>
</head>
<body>
<div class="wrap" id="wrap">
